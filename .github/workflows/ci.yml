# CI (Fase D4): lint, formatação, typecheck, testes unitários e de integração
# (Postgres como service container) e a jornada ponta a ponta com Playwright.
# Roda em pull requests e em push na main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Postgres do service container; o mesmo usuário/senha do docker-compose.yml
  DATABASE_URL: postgresql://minhaagenda:minhaagenda@localhost:5432/minhaagenda?schema=public
  E2E_DATABASE_URL: postgresql://minhaagenda:minhaagenda@localhost:5432/minhaagenda_test?schema=public
  E2E_PORT: "3100"
  AUTH_SECRET: ci-only-secret-not-used-in-production
  AUTH_URL: http://localhost:3100
  TZ: America/Sao_Paulo
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minhaagenda
          POSTGRES_PASSWORD: minhaagenda
          POSTGRES_DB: minhaagenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minhaagenda -d minhaagenda"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # versão vem do campo packageManager do package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências (gera o cliente Prisma no postinstall)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Banco de desenvolvimento (migrations + seed, para os testes de integração)
        run: |
          pnpm db:deploy
          pnpm db:seed

      - name: Testes unitários e de integração
        run: pnpm test

      - name: Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes ponta a ponta
        # o global-setup cria minhaagenda_test, migra e semeia; o webServer faz build + start na 3100
        run: pnpm test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
